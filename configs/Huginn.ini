[Wildcards]
; =============================================================================
; WILDCARD EXPLORATION
; =============================================================================
; A wildcard is an item Huginn is not sure about, shown for a while so it can
; learn whether you want it (a newly learned spell, an item you have not used
; in a long time, an effect it has little evidence on).
;
; Each page has ONE wildcard key: the last key in fill order (lowest
; iPriority, ties to the higher key) with bWildcardsEnabled = true, never the
; first key in fill order -- key 8 on the shipped pages. The log names it at
; load ("[SlotSettings] Page 0 'Main': 8 slots, wildcard key 8"). To move it,
; turn bWildcardsEnabled off on the keys after the one you want; off on every
; key, the page has no wildcard.
;
; When no wildcard is showing and fRefractorySeconds have passed, Huginn rolls
; once; a roll that fails waits another fRefractorySeconds. The roll's chance
; runs from fBaseProbability (nothing uncertain near the page) up to
; fMaxProbability (an unknown item at the edge of the page), so these two set
; how often wildcards appear: about one every fCooldownSeconds +
; fRefractorySeconds / chance (150 s at 0.5, about 6.5 minutes at 0.165).
; A roll that comes up shows, on the wildcard key, one of the items the page
; does not show, drawn by how close it is to the page times how unsure Huginn
; is of it; fUniformShare of the draw ignores that and picks uniformly, so
; every item keeps some chance. The wildcard stays fCooldownSeconds (none in
; combat), then the key's own item comes back. A wildcard never pushes a
; better item off the page: when the key's own item outranks the weakest item
; shown, it moves to that item's key for the while, and the weakest drops off.

fBaseProbability = 0.165
fMaxProbability = 0.5
fUniformShare = 0.1
fCooldownSeconds = 30
fRefractorySeconds = 60


[Subtexts]
; =============================================================================
; WHEELER ENTRY LABELS (v2 API only)
; =============================================================================
; Small text labels shown below items in Wheeler wheel entries.
; Priority order: Override > Lock Timer > Wildcard > Explanation

bShowWildcardLabel = true
sWildcardLabelText = Wildcard
bShowOverrideLabel = true
bShowLockTimerLabel = false
bLockTimerShowSeconds = true
sLockTimerPrefix = Locked
bShowExplanationLabel = true
; Offset from the wheel entry center (pixels). +Y = down, +X = right.
; X=0 centers the label under the item; Y sits it a line below the name.
fOffsetX = 0
fOffsetY = 90

[Learning]
; =============================================================================
; EXTERNAL EQUIP LEARNING
; =============================================================================
; Controls whether Huginn learns from selections made outside of Huginn:
; the inventory, favorites and magic menus, vanilla hotkeys, and your own
; Wheeler wheels. Such a selection teaches exactly what a Huginn key press
; does -- there are no per-source multipliers. An equip with no player input
; behind it (a script) never teaches anything.
;
; fExternalEquipTimeWindow: how old (ms) Huginn's last ranking may be for an
; outside selection to be attributed against it.

bLearnFromExternalEquips = true
fExternalEquipTimeWindow = 500.0

; Memory with a useful life. What you stop choosing is forgotten: an item
; keeps everything Huginn learned about it for fUsefulLifeHours of PLAY after
; you last chose it, plus fUsefulLifePerPickHours x ln(1 + times chosen) --
; your main weapon outlasts a long break, a sword you tried twice fades within
; a session or two. Then it fades over about fFadeHours, and once less than
; fForgetBelow of it is left it is forgotten: the next time you pick it is the
; first time. Fading lowers Huginn's confidence, not the item's score: a
; fading item goes back to being ranked on its own merits, never marked down.
; Play time only -- the game closed, paused or in a menu does not count, so a
; month away forgets nothing. bForgetUnusedItems = false keeps everything.
; Ranges: fUsefulLifeHours 0.1-10000, fUsefulLifePerPickHours 0-1000,
; fFadeHours 0.05-1000, fForgetBelow 0-0.5.
bForgetUnusedItems = true
fUsefulLifeHours = 8.0
fUsefulLifePerPickHours = 2.0
fFadeHours = 1.0
fForgetBelow = 0.05

; The new model (R8.3: it ranks; see [Scoring] bLegacyLearnFeature).
; sBootstrapBias: whether the shipped bootstrap (Huginn_Bootstrap.json) hands
;   the new model its per-item preferences, learned from one character's play:
;     match  - only when the save is the character the file was fitted on
;              (default; its needs-to-effects weights apply to every character)
;     always - every character
;     never  - no character (per-item preferences start from scratch)
;   Takes effect at the next load.
sBootstrapBias = match
; fThetaProcessNoise: how much the new model's certainty about a need loosens
;   each time that need starts while the page shows something that answers it
;   (an opportunity), so it keeps learning as your habits change. Counted per
;   start of the need, not per second. Small on purpose: it cannot be fitted
;   from the logs. Range: 0 - 1
fThetaProcessNoise = 0.0001

; The discovery boost. A spell you learn or an item you get for the first time
; on this character starts out more uncertain than everything you already
; carry, so the wildcard key offers it sooner. Without it a new item is no
; more uncertain than any of the hundreds you have never picked: the model
; starts from the shipped bootstrap, which knows nothing of what you gain
; later. Only the wildcard key reads it -- the ranking, and how hard a key's
; item is to dislodge, are untouched. What you held when the save loaded is
; never boosted, nor is something you get back after selling or using it up.
; The boost halves every fDiscoveryBoostHalfLifeSec of PLAY and ends the
; first time you pick the item.
;   fDiscoveryBoostVarMult: how many times more uncertain at first (4 = twice
;     the spread). Range: 1 - 100
;   fDiscoveryBoostHalfLifeSec: seconds of play to halve the boost (3600 = an
;     hour; about 8 hours to wear off). Range: 60 - 360000
bDiscoveryBoost = true
fDiscoveryBoostVarMult = 4.0
fDiscoveryBoostHalfLifeSec = 3600.0


[SlotLocker]
; =============================================================================
; SLOT LOCK SETTINGS
; =============================================================================
; Locks prevent recommendations from flickering when context changes briefly.

; Keep an item in the slot it was already in, instead of re-seating everything
; by rank every pass. Without this, one item arriving or leaving shifts every
; item below it by a slot: the recommendations stay correct, but the key under
; your finger stops meaning what it meant a second ago.
; The ranking still decides WHICH items are shown -- this only decides where.
; A slot freed by an item leaving is refilled with the next best candidate, so
; the layout only shows a gap when there are fewer candidates than slots.
bKeepSlotPositions = 1

; Keep an item that is still recommended in its slot until something scores
; clearly better FOR THAT SLOT. Without this, items that score within a few
; percent of each other trade places every time a lock runs out -- in play,
; most slot changes were less than 10% better than what they replaced -- and
; a higher-priority slot can pull an item out of its own slot further down.
; Needs bKeepSlotPositions.
bHoldSeatedItems = 1

; Who takes a held slot (0.24.2, the Bayesian challenger rule): every score is
; a best guess with an error bar, and a newcomer takes the slot only when it is
; better than the item there with probability above fChallengerConfidence --
; its lead must beat fChallengerMinGap + z x the spread of the two scores'
; difference (z = 0.84 at 0.8). Two items the learner knows well swap as soon
; as one is clearly ahead; a newcomer it knows little about needs a bigger
; lead; a near tie never swaps. What the two items have in common does not
; count toward the spread, so two healing potions are told apart by what makes
; them differ. Once one item has taken a slot this way, the one it replaced
; cannot take it back unless the situation or what Huginn has learned changes.
; fChallengerConfidence: 0.5-0.999 (0.5 = any lead). Raise it if keys still
; change too often; lower it if a clearly better item is slow to appear.
fChallengerConfidence = 0.8

; A minimum lead on top of the confidence, in score units (log-odds: 0.4 is
; about 1.5x as likely to be picked). 0 = confidence alone. 0-5.
fChallengerMinGap = 0

; Which newcomers get asked (0.24.13). 0 = only the best-ranked one for the
; slot: if Huginn is unsure it beats the item there, the slot stays put, even
; when a lower-ranked newcomer is surely better (it waits until the top one
; goes away or Huginn grows sure of it). 1 = ask them in rank order, and the
; first that clears the line above takes the slot: a surely-better item gets
; in sooner when the top rival is too uncertain, at the cost of a little more
; slot movement. Applies to the out-of-combat hold and to the combat upsert
; below alike. Only matters with the learned model: in the fallback ranking a
; lower item can never clear a margin the best one missed. An item that took
; a slot this way still cannot be swapped back while nothing changes.
bTestAllChallengers = 0

; The fixed margin, used only when Huginn ranks without its learned model (the
; fallback when Huginn_Bootstrap.json is missing or invalid; the log says so):
; how much better a newcomer must score to take a held slot, 0.5 = 50%.
; Measured 2026-10-07 on both lists: at 0.25, 35% of the changes the hold let
; through were under 1.5x; 0.5 removed them with nothing better kept out.
; The combat upsert's fallback barrier below is a multiple of it.
fChallengerMargin = 0.5

; Home keys: an item that drops off the page and comes back within
; fHomeKeyMemorySec goes back to the key it was on, instead of whichever key is
; open. Whatever filled the gap while it was away moves to the key the returning
; item would otherwise have taken. If the old key holds an override or a
; Remembrance item, the returning item shows on another key and gets its own
; key back when that ends -- unless something clearly better (the challenger
; rule above) wants it by then. If a slot's class does not fit, the item stays where it
; lands, and that becomes its key. It never hides a recommendation to wait for
; a key. Needs bKeepSlotPositions. fHomeKeyMemorySec is 0-600; 0 turns it off.
bReturnToHomeKey = 1
fHomeKeyMemorySec = 60

; The class cap: one slot class may not take every key. On Regular ("anything")
; keys, the first iClassFreeSlots items of one class compete at their full score;
; each one past that at x fClassRepeatDiscount, then x that again. Built for the
; hungry character at an alchemy lab who got eight foods on eight keys and none
; of the craft gear. A slot class is the item's job (healing, damage magic,
; defensive ...), and all food and drink counts as one. Keys with a job,
; overrides and Remembrance are not affected. Only placement changes: Huginn
; still learns from every item's true score. fClassRepeatDiscount = 1.0 turns
; it off. iClassFreeSlots is 1-10.
iClassFreeSlots = 3
fClassRepeatDiscount = 0.5

; Remembrance: press a key that puts a weapon, spell or scroll in your hand,
; and whatever was in that hand appears under the SAME key for this long --
; press it again to swap back. Arrows work the same way, arrows for arrows:
; switch Iron to Steel with a key and the Iron Arrows wait on it. Only a swap
; counts -- equipping into an empty hand or quiver leaves nothing to hold. It is not a recommendation: it ignores the slot's classification,
; only an override can take the slot from it, and swapping back teaches the
; learner nothing. Works from the hotkeys and from Huginn's own Wheeler
; wheels. Turn it off for one slot with bRemembrance = 0 in [PageN.SlotM];
; 0 here turns it off everywhere.
fRemembranceDurationMs = 15000

; The remembered item goes on the key you pressed even when it does not fit
; that key's job -- the dagger a spell took off shows on the attack-magic key --
; but only for this long. A swap that fits the key keeps the full time above.
fRemembranceMismatchDurationMs = 5000

; Where a remembered item that does NOT fit the pressed key goes:
;   Pressed - the key you pressed, for fRemembranceMismatchDurationMs (default)
;   Job     - the first key whose class fits it: the dagger a spell took off
;             goes to the Weapon key, the spell a weapon took off to the
;             attack-magic key. Falls back to the pressed key if none fits.
sRemembranceTarget = Pressed

; A key with a job (Weapon, Heal...) that would otherwise be blank takes a
; matching item off a Regular key: the bow moves from key 7 to the empty
; Weapon key. Off by default -- an item stays where it is, so keys do not
; shuffle, at the cost of the odd blank job key.
bFillJobKeysFromRegular = 0

; Lock duration in milliseconds (0 = disable locking)
fLockDurationMs = 3000

; In combat, keys lock for this long instead of fLockDurationMs. -1 = freeze:
; a key keeps its item until combat ends; a key still on its fLockDurationMs lock
; when combat starts is combat-locked on its item too. While a key is
; combat-locked nothing that merely scores better can take it (one that is
; almost surely better can: the combat upsert below) -- only its item running out (the last
; potion drunk, the weapon dropped, a spell you no longer know), the item ending
; up in your hands without a swap-back on that key, an emergency (override)
; placed on that very key, or the swap-back of a key you pressed (Remembrance).
; An urgent emergency (iImmediateBreakPriority or higher) takes its key even
; with bOverridesBreakLock = false, or a freeze would hide it all fight. A spell
; you cannot afford right now stays on its key instead of vanishing and coming
; back with your magicka; items also stop moving between keys. Empty keys still
; fill. When combat ends, keys fall back to fLockDurationMs from that moment, so
; the last kill does not reshuffle the page. A held key's numbers (stack count,
; charge, ammo) still update. Changing this in the middle of a fight affects
; keys locked after the change; keys already locked keep theirs until combat
; ends. 0 = use fLockDurationMs in combat too; otherwise 1-120000 ms.
fCombatLockDurationMs = -1

; The game can keep you "in combat" for minutes after the last enemy is gone.
; With no enemy around for this many seconds, the combat lock lets go as if
; combat had ended (and comes back if an enemy shows up). Enemies are counted
; within detection range (about 2048 units): an archer or mage fighting from
; farther away, or a dragon circling out of range, thaws the keys after this
; long, and they lock again when it comes back. 0 = follow the game's combat
; flag alone; 0-60.
fCombatNoEnemyReleaseSec = 5

; Combat upsert: a recommendation takes a combat-locked key when it is almost
; surely better than the item on that key -- the same challenger rule as
; fChallengerConfidence above, with the stricter confidence
; fCombatChallengerConfidence, because a key that changes mid-fight costs more
; than one that changes at rest (you reach for it and press the wrong thing).
; It takes items the page would show that no key shows, and never touches a
; key showing an emergency (override) or a swap-back, a key you pressed or that
; changed less than fPressGraceMs ago, or any key while the Wheeler wheel is
; open. An item that just left a key (or that an upsert pushed off one this
; fight) never comes back this way, and the page takes at most one upsert
; every 3 seconds. The new item is combat-locked in turn.
;
; fCombatChallengerConfidence (0.24.13): how sure Huginn must be that the
; newcomer is better, 0.5-0.999. 0.995 keeps the old upsert's strictness: its
; fixed margin was 3 times the out-of-combat one, and 3 times the z of
; fChallengerConfidence = 0.8 is the z of 0.994. Lower it if a clearly better
; item waits out the fight; raise it if keys still change under your fingers.
fCombatChallengerConfidence = 0.995
;
; fCombatUpsertMarginMult: 0 = off, the freeze is absolute (with the learned
; model too). Otherwise the fixed barrier for when Huginn has no error bar for
; the pair -- the fallback ranking (no Huginn_Bootstrap.json), or an item on
; the key that was not scored this time: the newcomer must beat the item by
; this many times ln(1 + fChallengerMargin) (ln 1.5 = 0.405; 3 = about 3.4
; times as good). 0-20.
fCombatUpsertMarginMult = 3.0

; At most one combat upsert per key in this many seconds. 0 = no limit; 0-300.
fCombatUpsertCooldownSec = 10

; Minimum lock time before overrides can break
fMinLockDurationMs = 500

; Lock when slot fills from empty
bLockOnFill = true

; Allow overrides to break locks
bOverridesBreakLock = true

; Minimum priority to break locks instantly (DROWNING=50, CRITICAL_HEALTH=100)
iImmediateBreakPriority = 50

; Press grace (misclick guard): a key pressed less than this many ms after its
; item changed -- or whose item changes while the tap waits out the double-tap
; window -- uses the item it showed before the change, as long as that item can
; still be used. Measured from when the key went down. Never when the key now
; shows an emergency (override): the urgent item is what you get. Pressing the
; same key again right after your own press (a Remembrance swap-back) is not
; affected. Huginn's own Wheeler wheels are not covered: Wheeler equips what it
; shows itself. 0 turns it off; 0-2000.
fPressGraceMs = 600

; Hysteresis on the health/magicka/stamina levels (Critical/VeryLow/Low/Med/
; High/VeryHigh at 10/25/40/60/80%) that decide when the page is re-scored: a
; recovering pool moves up a level only this far past the boundary (0.03 = 3
; points: 80% -> above 83%). A pool falling from above a boundary moves at the
; boundary itself; one that falls back after recovering less than the band (8%
; -> 12% -> 9%) never left the lower level, so that second fall is not a new
; change. Emergencies (overrides) do not depend on these levels: the page is
; re-scored whenever a vital crosses an override's own threshold. Built for
; magicka bouncing on a boundary while you cast and regenerate. 0 turns it
; off; 0-0.1.
fVitalBucketHysteresis = 0.03

; Hysteresis on the distance to the closest enemy (melee up to 256 units, mid
; up to 768, ranged beyond), as a fraction of the boundary, both ways: 0.1 =
; melee -> mid past 282 units, mid -> melee under 230. Built for an enemy pacing
; at the edge of melee re-scoring the page every few tenths of a second.
; 0 turns it off; 0-0.5.
fDistanceBucketHysteresis = 0.1

[Wheeler]
; =============================================================================
; WHEELER INTEGRATION
; =============================================================================

; sWheelPosition: Where Huginn wheels appear in the Wheeler wheel list
;   First = First wheel (immediately visible when opening Wheeler)
;   Last  = Last wheel (append after all other wheels)
;   <number> = Specific index (e.g., 2 = third wheel)
sWheelPosition = First

; bAutoFocusOnOpen: Auto-navigate to Huginn wheel when Wheeler opens
bAutoFocusOnOpen = true

; bAutoFocusOnOverride: Navigate to Huginn wheel when override fires
bAutoFocusOnOverride = true

; iAutoFocusMinPriority: Minimum override priority to trigger auto-focus
;   DROWNING=50, CRITICAL_MAGICKA=70, CRITICAL_HEALTH=100
;   Such an override also updates a Huginn wheel while it is open -- its own
;   entry only; the rest of the open wheel stays as it was when you opened it.
iAutoFocusMinPriority = 50

; sPostActivationPolicy: What happens after player activates a slot's item
;   Backfill = Replace with next-best candidate (default)
;   Sticky   = Keep item visible until context changes
;   Empty    = Clear slot and show "Equipped" label
sPostActivationPolicy = Backfill
