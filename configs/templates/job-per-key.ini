; =============================================================================
; TEMPLATE: Job per key (the default layout before 0.22.10)
; =============================================================================
; Page 1 "Huginn" gives every key a job and shows the best thing for that job
; that is not already in your hands: 1 weapon, 2 attack magic, 3 heal,
; 4 defend, 5 buff, 6 potion, 7 situational, 8 wildcard. Page 2 "Kit" is for
; between fights: potions, food, scrolls, utility, summons, arrows, crafting
; gear -- one kind per key.
;
; The shipped default became one page of eight Regular keys in 0.22.10 -- the
; layout Huginn is aiming for. Use this one if you prefer labeled keys.
;
; HOW TO USE: this file holds only the page layout. In Huginn.ini, delete
; [Pages] and every [PageN] / [PageN.SlotM] section, paste everything below
; the line in their place, then type `hg reload` in the console.
;
; Emergencies keep the same keys as every template -- health on key 1,
; magicka on 2, stamina on 3 -- and key 7 takes the quieter prompts.
; =============================================================================

[Pages]
iPageCount = 2

; =============================================================================
; PAGE 0 - "Huginn" (the flagship page: one job per key)
; =============================================================================
; Every key has a job, and shows the best thing for that job that is NOT
; already in your hands (bSkipEquipped is on by default):
;   1 Weapon        the other weapon -- the bow while the sword is out, or a
;                   second melee weapon. Swap, and the one you took off comes
;                   back to this key: one key toggles between two weapons.
;   2 Attack magic  damage spells and damage scrolls (no weapons, no poisons)
;   3 Heal          healing spells and health potions
;   4 Defend        wards, armour spells, resist potions
;   5 Buff          fortify, invisibility, muffle
;   6 Potion        whatever potion suits the moment
;   7 Situational   anything, plus the quieter prompts: arrows when the quiver
;                   runs low, a soul gem for a drained weapon, waterbreathing
;   8 Wildcard      the best of everything else, and now and then something
;                   Huginn wants you to try
; Emergencies: health lands on key 1, magicka on key 2, stamina on key 3.
; Key 7 takes only the Other prompts, so a vital emergency can never crowd
; them out.

[Page0]
sName = Huginn
iSlotCount = 8

[Page0.Slot0]
sClassification = WeaponsAny
bWildcardsEnabled = true
bOverridesEnabled = HP
iPriority = 7

[Page0.Slot1]
sClassification = DamageMagic
bWildcardsEnabled = true
bOverridesEnabled = MP
iPriority = 6

[Page0.Slot2]
sClassification = HealingAny
bWildcardsEnabled = true
bOverridesEnabled = SP
iPriority = 5

[Page0.Slot3]
sClassification = DefensiveAny
bWildcardsEnabled = true
bOverridesEnabled = None
iPriority = 4

[Page0.Slot4]
sClassification = BuffsAny
bWildcardsEnabled = true
bOverridesEnabled = None
iPriority = 3

[Page0.Slot5]
sClassification = PotionsAny
bWildcardsEnabled = true
bOverridesEnabled = None
iPriority = 2

[Page0.Slot6]
sClassification = Regular
bWildcardsEnabled = true
bOverridesEnabled = Other
iPriority = 1

[Page0.Slot7]
sClassification = Regular
bWildcardsEnabled = true
bOverridesEnabled = None
iPriority = 0

; =============================================================================
; PAGE 1 - "Kit" (out of combat: what you carry)
; =============================================================================
; One kind of thing per key, no emergencies. The page to flip to between
; fights: food, the right potion or scroll, arrows, crafting gear.

[Page1]
sName = Kit
iSlotCount = 8

[Page1.Slot0]
sClassification = PotionsAny
bWildcardsEnabled = true
bOverridesEnabled = None
iPriority = 7

[Page1.Slot1]
sClassification = FoodAny
bWildcardsEnabled = true
bOverridesEnabled = None
iPriority = 6

[Page1.Slot2]
sClassification = ScrollsAny
bWildcardsEnabled = true
bOverridesEnabled = None
iPriority = 5

[Page1.Slot3]
sClassification = Utility
bWildcardsEnabled = true
bOverridesEnabled = None
iPriority = 4

[Page1.Slot4]
sClassification = SummonsAny
bWildcardsEnabled = true
bOverridesEnabled = None
iPriority = 3

[Page1.Slot5]
sClassification = AmmoAny
bWildcardsEnabled = true
bOverridesEnabled = None
iPriority = 2

[Page1.Slot6]
sClassification = ApparelAny
bWildcardsEnabled = true
bOverridesEnabled = None
iPriority = 1

[Page1.Slot7]
sClassification = Regular
bWildcardsEnabled = true
bOverridesEnabled = None
iPriority = 0
