; =============================================================================
; TEMPLATE: Test pages
; =============================================================================
; Five pages that each isolate one feature, for testing and for reading logs:
; emergencies, classes (two pages), ranking, and swap back / equip. Wildcards
; and swap back are off unless the page is about them.
;
; HOW TO USE: these are pages 3-7, meant to sit AFTER the two default pages.
; In Huginn.ini set iPageCount = 7 under [Pages], paste everything below the
; line after the [Page1.Slot...] sections, then type `hg reload`. Their
; sections are numbered [Page2]-[Page6] to follow on from the default pages.
; =============================================================================

; =============================================================================
; PAGE 2 - "T: Emergencies" -- health on key 1, magicka on 2, stamina on 3,
; soul gem / ammo / drowning on 4. Key 5 is a CONTROL: potions with no
; overrides, showing what normal ranking picks next to the emergency.

[Page2]
sName = T: Emergencies
iSlotCount = 8

[Page2.Slot0]
sClassification = Regular
bWildcardsEnabled = false
bOverridesEnabled = HP
iPriority = 7
bRemembrance = 0

