; =============================================================================
; TEMPLATE: Paladin
; =============================================================================
; Heavy armour, a weapon and Restoration. Two heal keys on purpose: key 3
; is your best heal, key 4 the next best, so a potion is ready while the
; spell recharges your magicka.
;
; Page 1: Combat
; Page 2: Prep
;
; HOW TO USE: this file holds only the page layout. In Huginn.ini, delete
; [Pages] and every [PageN] / [PageN.SlotM] section, paste everything below
; the line in their place, then type `hg reload` in the console.
;
; Every template keeps the same emergency keys as the default page -- health
; on key 1, magicka on 2, stamina on 3 -- and key 7 takes the quieter prompts
; (arrows running low, a soul gem for a drained weapon, waterbreathing).
; Switching template never moves "heal me". Keys skip what you are already
; holding, and a key you press to swap something in shows what it took off
; for a few seconds (swap back). Both are on by default; see Huginn.ini.
; =============================================================================

[Pages]
iPageCount = 2

; =============================================================================
; PAGE 1 - Combat
; =============================================================================

[Page0]
sName = Combat
iSlotCount = 8

; Key 1: Melee weapon -- the one not in your hand
[Page0.Slot0]
sClassification = WeaponsMelee
bWildcardsEnabled = true
bOverridesEnabled = HP
iPriority = 7

; Key 2: Restoration -- turn undead, wards, sun damage
[Page0.Slot1]
sClassification = SpellsRestoration
bWildcardsEnabled = true
bOverridesEnabled = MP
iPriority = 6

; Key 3: Heal
[Page0.Slot2]
sClassification = HealingAny
bWildcardsEnabled = true
bOverridesEnabled = SP
iPriority = 5

; Key 4: Second heal (deliberate duplicate)
[Page0.Slot3]
sClassification = HealingAny
bWildcardsEnabled = true
bOverridesEnabled = None
iPriority = 4

; Key 5: Defend -- ward, armour spell, resist potion
[Page0.Slot4]
sClassification = DefensiveAny
bWildcardsEnabled = true
bOverridesEnabled = None
iPriority = 3

; Key 6: Buff
[Page0.Slot5]
sClassification = BuffsAny
bWildcardsEnabled = true
bOverridesEnabled = None
iPriority = 2

; Key 7: Situational -- plus arrows / soul gem / waterbreathing
[Page0.Slot6]
sClassification = Regular
bWildcardsEnabled = true
bOverridesEnabled = Other
iPriority = 1

; Key 8: Wildcard
[Page0.Slot7]
sClassification = Regular
bWildcardsEnabled = true
bOverridesEnabled = None
iPriority = 0

; =============================================================================
; PAGE 2 - Prep
; =============================================================================

[Page1]
sName = Prep
iSlotCount = 6

; Key 1: Pre-fight buff
[Page1.Slot0]
sClassification = BuffsAny
bWildcardsEnabled = true
bOverridesEnabled = None
iPriority = 5

; Key 2: Resist potion or ward for what is ahead
[Page1.Slot1]
sClassification = DefensiveAny
bWildcardsEnabled = true
bOverridesEnabled = None
iPriority = 4

; Key 3: Potion
[Page1.Slot2]
sClassification = PotionsAny
bWildcardsEnabled = true
bOverridesEnabled = None
iPriority = 3

; Key 4: Food
[Page1.Slot3]
sClassification = FoodAny
bWildcardsEnabled = true
bOverridesEnabled = None
iPriority = 2

; Key 5: Utility -- light, detect, cure
[Page1.Slot4]
sClassification = Utility
bWildcardsEnabled = true
bOverridesEnabled = None
iPriority = 1

; Key 6: Anything else
[Page1.Slot5]
sClassification = Regular
bWildcardsEnabled = true
bOverridesEnabled = None
iPriority = 0
