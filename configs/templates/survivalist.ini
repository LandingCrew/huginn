; =============================================================================
; TEMPLATE: Survivalist
; =============================================================================
; Survival Mode: hunger, cold and fatigue matter as much as the fight. Page 2
; keeps you fed and warm; page 1 is the fight, with the same emergency keys
; as every other template.
;
; Page 1: Combat
; Page 2: Survival
;
; HOW TO USE: this file holds only the page layout. In Huginn.ini, delete
; [Pages] and every [PageN] / [PageN.SlotM] section, paste everything below
; the line in their place, then type `hg reload` in the console.
;
; Every template keeps the same emergency keys as the default page -- health
; on key 1, magicka on 2, stamina on 3 -- and key 7 takes the quieter prompts
; (arrows running low, a soul gem for a drained weapon, waterbreathing).
; Switching template never moves "heal me". Keys skip what you are already
; holding, and a key you press to swap something in shows what it took off
; for a few seconds (swap back). Both are on by default; see Huginn.ini.
; =============================================================================

[Pages]
iPageCount = 2

; =============================================================================
; PAGE 1 - Combat
; =============================================================================

[Page0]
sName = Combat
iSlotCount = 8

; Key 1: Weapon -- the one not in your hand
[Page0.Slot0]
sClassification = WeaponsAny
bWildcardsEnabled = true
bOverridesEnabled = HP
iPriority = 7

; Key 2: Bow for the hunt
[Page0.Slot1]
sClassification = WeaponsRanged
bWildcardsEnabled = true
bOverridesEnabled = MP
iPriority = 6

; Key 3: Heal
[Page0.Slot2]
sClassification = HealingAny
bWildcardsEnabled = true
bOverridesEnabled = SP
iPriority = 5

; Key 4: Arrows
[Page0.Slot3]
sClassification = AmmoAny
bWildcardsEnabled = true
bOverridesEnabled = None
iPriority = 4

; Key 5: Resist potion -- frost first, in the cold
[Page0.Slot4]
sClassification = DefensiveAny
bWildcardsEnabled = true
bOverridesEnabled = None
iPriority = 3

; Key 6: Potion
[Page0.Slot5]
sClassification = PotionsAny
bWildcardsEnabled = true
bOverridesEnabled = None
iPriority = 2

; Key 7: Situational -- plus arrows running low / waterbreathing
[Page0.Slot6]
sClassification = Regular
bWildcardsEnabled = true
bOverridesEnabled = Other
iPriority = 1

; Key 8: Wildcard
[Page0.Slot7]
sClassification = Regular
bWildcardsEnabled = true
bOverridesEnabled = None
iPriority = 0

; =============================================================================
; PAGE 2 - Survival
; =============================================================================

[Page1]
sName = Survival
iSlotCount = 8

; Key 1: Food
[Page1.Slot0]
sClassification = FoodAny
bWildcardsEnabled = true
bOverridesEnabled = None
iPriority = 7

; Key 2: Second food (deliberate duplicate: a meal and a snack)
[Page1.Slot1]
sClassification = FoodAny
bWildcardsEnabled = true
bOverridesEnabled = None
iPriority = 6

; Key 3: Drink
[Page1.Slot2]
sClassification = AlcoholAny
bWildcardsEnabled = true
bOverridesEnabled = None
iPriority = 5

; Key 4: Potion
[Page1.Slot3]
sClassification = PotionsAny
bWildcardsEnabled = true
bOverridesEnabled = None
iPriority = 4

; Key 5: Buff -- warmth, stamina
[Page1.Slot4]
sClassification = BuffsAny
bWildcardsEnabled = true
bOverridesEnabled = None
iPriority = 3

; Key 6: Utility -- light, cure
[Page1.Slot5]
sClassification = Utility
bWildcardsEnabled = true
bOverridesEnabled = None
iPriority = 2

; Key 7: Scroll
[Page1.Slot6]
sClassification = ScrollsAny
bWildcardsEnabled = true
bOverridesEnabled = None
iPriority = 1

; Key 8: Anything else
[Page1.Slot7]
sClassification = Regular
bWildcardsEnabled = true
bOverridesEnabled = None
iPriority = 0
