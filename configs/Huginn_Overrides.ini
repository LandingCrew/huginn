; =============================================================================
; Huginn Classification Overrides  (items AND spells)
; =============================================================================
; Copy this file to: Data/SKSE/Plugins/Huginn_Overrides.ini
;
; Use this file to override classifications for modded potions, foods, other
; consumables, and spells that aren't automatically classified correctly.
;
; SYNTAX:
;   [Item:Name]  or  [Item:FormID]     <- potions, food, soul gems
;   [Spell:Name] or  [Spell:FormID]    <- spells
;   [Name]       or  [FormID]          <- legacy: offered to BOTH domains
;   type = <one type from the matching list below>
;   tags = Tag1,Tag2,Tag3
;
; ---------------------------------------------------------------------------
; WHY THE PREFIX MATTERS
; ---------------------------------------------------------------------------
; This one file is read by two separate loaders: the item classifier and the
; spell classifier. An UNPREFIXED section is offered to both, and several token
; names exist in both vocabularies -- RestoreHealth, RestoreMagicka,
; RestoreStamina, Fear, Frenzy, Invisibility, and `type = buff` -- so an
; unprefixed section can silently apply to a spell and a potion that share a
; display name. Prefixing makes a section visible to exactly one domain.
;
; Prefixes are case-insensitive and may have spaces around the colon.
; Tokens that don't parse in a domain's vocabulary no longer blank that
; domain's auto-detection: the tag list is ignored and a warning is logged.
; Each loader reports how many unprefixed sections it saw, so `Huginn.log` will
; tell you whether anything is still ambiguous.
;
; Both loaders re-read this file on `hg rebuild` and `hg reset all` -- no game
; restart needed. (`hg reload` reloads INI settings, not classifications.)
;
; ITEM TYPES:
;   HealthPotion    - Restore health
;   MagickaPotion   - Restore magicka
;   StaminaPotion   - Restore stamina
;   ResistPotion    - Resist fire/frost/shock/poison/magic
;   BuffPotion      - Fortify attribute/skill
;   CurePotion      - Cure disease/poison
;   Poison          - Hostile (apply to weapon)
;   Food            - CC Survival Mode food
;   Alcohol         - Alcoholic beverages (ale, mead, wine, skooma)
;   Ingredient      - Raw alchemy ingredient
;   Fortify         - ALIAS for BuffPotion (same classification, not a separate type)
;
; NOT accepted: SoulGem, Scroll. Soul gems are classified from the form type and
; scrolls are handled by the spell path, so both log "Unknown item type" here.
; Ingredient is accepted by the parser but unreachable in practice: ItemRegistry
; only admits AlchemyItem and SoulGem forms, so an ingredient never enters the
; registry for an override to apply to.
;
; TAGS (comma-separated):
;   RestoreHealth, RestoreMagicka, RestoreStamina
;   ResistFire, ResistFrost, ResistShock, ResistMagic, ResistPoison
;   FortifyHealth, FortifyMagicka, FortifyStamina
;   FortifyMagicSchool, FortifyCombatSkill, FortifyUtilitySkill
;   RegenHealth, RegenMagicka, RegenStamina
;   CureDisease, CurePoison
;   Invisibility, Waterbreathing, FortifyCarryWeight
;   DamageHealth, DamageMagicka, DamageStamina
;   Paralyze, Slow, Fear, Frenzy
;   SatisfiesHunger, SatisfiesCold
;
; ---------------------------------------------------------------------------
; SPELL TYPES  (for [Spell:...] sections)
; ---------------------------------------------------------------------------
;   Healing, Damage, Defensive, Utility, Summon, Buff, Debuff, Unknown
;
; SPELL TAGS (comma-separated, for [Spell:...] sections):
;   Elements:    Fire, Frost, Shock, Poison, Sun
;   Delivery:    Ranged, Melee (alias Touch), AOE, Concentration
;   Targets:     AntiUndead, AntiDaedra
;   Restoration: RestoreHealth, RestoreMagicka, RestoreStamina, Ward, TurnUndead
;   Alteration:  Armor, DetectLife, Light, Telekinesis, Paralysis
;   Illusion:    Calm (alias Charm), Fear, Frenzy, Invisibility, Muffle
;   Other:       Stealth, Conjuration
;   School aliases (map to a representative tag, not a school):
;     Restoration -> RestoreHealth, Alteration -> Armor, Illusion -> Calm,
;     Destruction -> Fire, Offensive -> Fire, Defensive -> Armor
;
; Extended spell tags (ItemTagExt / the #79 set) are NOT overridable here.
;
; =============================================================================

; =============================================================================
; EXAMPLE: Modded Health Potions
; =============================================================================
; Use this section to force items to be classified as health potions.
; Useful when mods add potions that don't use standard effect archetypes.

; [Potion of Greater Healing]
; type = HealthPotion
; tags = RestoreHealth

; [Elixir of Restoration]
; type = HealthPotion
; tags = RestoreHealth,RegenHealth

; =============================================================================
; EXAMPLE: FormID-based Override
; =============================================================================
; Use FormID when multiple items share the same name.
; Format: 8-digit hex (e.g., 00012345) or with 0x prefix (0x00012345)
; Note: For mod items, use the local FormID (without load order prefix)

; [0x00012345]
; type = MagickaPotion
; tags = RestoreMagicka

; =============================================================================
; EXAMPLE: Survival Mode Foods (CC or mods)
; =============================================================================
; Foods that should satisfy hunger/cold in survival mode.

; [Warm Stew]
; type = Food
; tags = SatisfiesHunger,SatisfiesCold

; [Venison Chop]
; type = Food
; tags = SatisfiesHunger

; =============================================================================
; EXAMPLE: Resist Potions
; =============================================================================

; [Potion of Fire Warding]
; type = ResistPotion
; tags = ResistFire

; [Elemental Shield Draught]
; type = ResistPotion
; tags = ResistFire,ResistFrost,ResistShock

; =============================================================================
; EXAMPLE: Buff/Fortify Potions
; =============================================================================

; [Blacksmith's Philter]
; type = BuffPotion
; tags = FortifyCombatSkill

; [Philter of the Mage]
; type = BuffPotion
; tags = FortifyMagicSchool

; [Potion of Plunder]
; type = BuffPotion
; tags = FortifyUtilitySkill

; =============================================================================
; EXAMPLE: Poisons
; =============================================================================

; [Nerve Toxin]
; type = Poison
; tags = Paralyze,DamageStamina

; [Frenzy Poison]
; type = Poison
; tags = Frenzy

; =============================================================================
; LORERIM / REQUIEM EXAMPLES
; =============================================================================
; Lorerim and Requiem often rename or modify potions. Add overrides here
; if items aren't being classified correctly.

; [Regeneration Draught]
; type = HealthPotion
; tags = RegenHealth

; [Battlemage's Elixir]
; type = BuffPotion
; tags = FortifyMagicSchool,FortifyHealth

; =============================================================================
; APOCALYPSE / TRIUMVIRATE ITEM EXAMPLES
; =============================================================================
; Some spell mods add consumable items that need classification.

; Scrolls are NOT overridable through this file — they classify through the spell
; path (ScrollRegistry -> ClassifySpell), so a [Scroll of ...] section here is
; parsed as an ITEM override and rejected. Left as a worked non-example:
; [Scroll of Bolide]
; type = Scroll
; tags = DamageFire

; =============================================================================
; EXAMPLE: Alcohol / Drinks
; =============================================================================
; Items auto-detected as alcohol: ale, mead, wine, skooma, beer, brandy,
; mazte, flin, shein, jagga, rotmeth. Also detected via mod keywords:
; VendorItemAlcohol, CACO_IsAlcohol, VendorItemSkooma.
; Use overrides for drinks not caught by auto-detection.

; [Emberbrew]
; type = Alcohol

; [Stumbling Sabrecat]
; type = Alcohol
; tags = SatisfiesHunger

